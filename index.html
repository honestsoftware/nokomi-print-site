<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nokomi Print</title>
<style>
  :root { color-scheme: light dark; --ink:#1f2430; --muted:#5d574c; --paper:#fffdf8; --bg:#f7f5f0; --accent:#3d55c7; --line:#d8d2c4; }
  @media (prefers-color-scheme: dark) { :root { --ink:#e8e4dc; --muted:#c7c1b6; --paper:#1b2027; --bg:#121519; --accent:#b7c4ff; --line:#444b53; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; line-height:1.7; }
  main { max-width:760px; margin:0 auto; padding:64px 24px; }
  .mark { width:88px; height:88px; border-radius:22px; background:#121519; display:grid; place-items:center; color:#fffdf8; font-weight:800; font-size:30px; margin-bottom:28px; }
  h1 { font-size:clamp(34px,7vw,56px); line-height:1.05; letter-spacing:-.04em; margin:0 0 16px; }
  p { color:var(--muted); font-size:18px; max-width:600px; }
  .links { display:flex; gap:10px; flex-wrap:wrap; margin-top:30px; }
  a { color:var(--accent); text-decoration:none; border:1px solid var(--line); background:var(--paper); padding:11px 17px; border-radius:999px; font-weight:700; }
</style>
</head>
<body>
<main>
  <div class="mark">NP</div>
  <h1>Nokomi Print</h1>
  <p>Print PDF, Word, photos and web pages from your phone over Wi-Fi. No account. No ads.</p>
  <div class="links"><a href="privacy-policy.html">Privacy / Gizlilik</a><a href="support.html">Support / Destek</a></div>
</main>
</body>
</html>
